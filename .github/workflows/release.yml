name: Release Multiplatform

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            artifact_name: 'macos-universal'
            bundle_path: 'src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg'
          - platform: 'windows-latest'
            args: ''
            artifact_name: 'windows-x64'
            bundle_path: 'src-tauri/target/release/bundle/nsis/*.exe'
          - platform: 'ubuntu-22.04'
            args: ''
            artifact_name: 'linux-x64'
            bundle_path: 'src-tauri/target/release/bundle/deb/*.deb'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Set Release Tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=App ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v__VERSION__" >> $GITHUB_OUTPUT
            echo "release_name=App v__VERSION__" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_info.outputs.tag_name }}
          releaseName: ${{ steps.release_info.outputs.release_name }}
          releaseBody: 'See the assets to download this release.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: warn
