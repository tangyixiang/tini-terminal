<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#14b8a6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: dark rounded square -->
  <rect width="512" height="512" rx="112" fill="#0d0d0d"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Subtle border ring -->
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none"
        stroke="#22c55e" stroke-width="1.5" opacity="0.18"/>

  <!-- Terminal prompt chevron > -->
  <path d="M168 196 L292 256 L168 316"
        fill="none" stroke="url(#promptGrad)"
        stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blinking cursor block _ -->
  <rect x="322" y="232" width="30" height="48" rx="6" fill="url(#cursorGrad)"/>

  <!-- AI neural cluster (top-right, represents AI panel) -->
  <g opacity="0.7">
    <line x1="337" y1="232" x2="378" y2="178" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="378" y1="178" x2="412" y2="205" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="378" y1="178" x2="350" y2="150" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="378" cy="178" r="8" fill="#4ade80" filter="url(#softGlow)"/>
    <circle cx="412" cy="205" r="6" fill="#14b8a6"/>
    <circle cx="350" cy="150" r="5" fill="#4ade80" opacity="0.7"/>
  </g>

  <!-- AI spark dots (bottom, subtle) -->
  <g opacity="0.45">
    <circle cx="354" cy="318" r="4" fill="#14b8a6"/>
    <circle cx="378" cy="340" r="3.5" fill="#4ade80"/>
    <circle cx="404" cy="322" r="3" fill="#14b8a6"/>
    <line x1="354" y1="318" x2="378" y2="340" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
    <line x1="378" y1="340" x2="404" y2="322" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
